<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hora de Aprender!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <button id="btn-inicio" class="btn btn-pequeno" hidden>🏠 Início</button>
    <h1>🦉 Hora de Aprender!</h1>
    <div class="topo-direita">
      <span class="estrelas" title="As tuas estrelas">⭐ <b id="estrelas">0</b></span>
      <button id="btn-som" class="btn btn-pequeno" aria-label="Ligar ou desligar o som">🔊</button>
    </div>
  </header>

  <main>
    <!-- MENU -->
    <section id="vista-menu" class="vista">
      <div class="mascote">
        <div class="balao">Olá, amiguinha! O que vamos aprender hoje?</div>
        <div class="coruja">🦉</div>
      </div>
      <div class="cartoes">
        <button class="cartao cartao-relogio" data-vista="relogio">
          <span class="cartao-icone">🕒</span>
          <span class="cartao-titulo">O Relógio</span>
          <span class="cartao-texto">Aprende a ler as horas!</span>
        </button>
        <button class="cartao cartao-calendario" data-vista="calendario">
          <span class="cartao-icone">📅</span>
          <span class="cartao-titulo">O Calendário</span>
          <span class="cartao-texto">Encontra os dias certos!</span>
        </button>
      </div>
    </section>

    <!-- RELÓGIO -->
    <section id="vista-relogio" class="vista" hidden>
      <div class="separadores">
        <button class="separador ativo" data-modo="ler">👀 Que horas são?</button>
        <button class="separador" data-modo="por">✋ Põe as horas!</button>
      </div>

      <div class="relogio-layout">
        <svg id="relogio-svg" viewBox="-125 -125 250 250" role="img" aria-label="Relógio com ponteiros"></svg>

        <div class="painel">
          <p id="relogio-pergunta" class="pergunta"></p>
          <p id="relogio-alvo" class="hora-digital" hidden></p>
          <p id="relogio-extenso" class="extenso" hidden></p>

          <form id="relogio-form" class="resposta" autocomplete="off">
            <input id="relogio-input" type="text" inputmode="numeric" placeholder="ex: 03:30" maxlength="5" aria-label="Escreve a hora">
            <button class="btn btn-verde" type="submit" id="relogio-verificar">Verificar ✔</button>
          </form>

          <p id="relogio-feedback" class="feedback" role="status" aria-live="polite"></p>

          <div class="acoes">
            <button id="relogio-dica" class="btn btn-amarelo">💡 Dica</button>
            <button id="relogio-seguinte" class="btn btn-azul">Seguinte ➜</button>
          </div>

          <div class="opcoes">
            <label>Nível
              <select id="relogio-nivel">
                <option value="1">1 – Horas certas</option>
                <option value="2">2 – E meia</option>
                <option value="3">3 – Quartos</option>
                <option value="4">4 – De 5 em 5 minutos</option>
                <option value="5">5 – Todos os minutos</option>
              </select>
            </label>
            <label id="relogio-label-24"><input type="checkbox" id="relogio-24"> Horas de 24h</label>          </div>
        </div>
      </div>
    </section>

    <!-- CALENDÁRIO -->
    <section id="vista-calendario" class="vista" hidden>
      <div class="pergunta-caixa">
        <span class="coruja-pequena">🦉</span>
        <p id="cal-pergunta" class="pergunta pergunta-grande"></p>
      </div>
      <p id="cal-feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="acoes">
        <button id="cal-dica" class="btn btn-amarelo">💡 Dica</button>
        <button id="cal-seguinte" class="btn btn-azul">Nova pergunta ➜</button>
        <label class="opcoes-linha">Nível
          <select id="cal-nivel">
            <option value="1">1 – Dias e meses</option>
            <option value="2">2 – Dias da semana</option>
            <option value="3">3 – Antes e depois</option>
            <option value="4">4 – Meses por número</option>
          </select>
        </label>
      </div>
      <h2 id="cal-ano" class="ano"></h2>
      <div id="cal-meses" class="meses"></div>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="common.js"></script>
  <script src="clock.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
